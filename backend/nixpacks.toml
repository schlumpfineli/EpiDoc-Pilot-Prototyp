[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer']

[phases.install]
cmds = [
    'composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist'
]

[phases.build]
# Kein config:cache hier: Railway-Umgebungsvariablen (z. B. MAIL_MAILER) sind zur Build-Zeit
# oft noch nicht vollständig – sonst wird MAIL_MAILER=log dauerhaft eingefroren.
cmds = [
    'php artisan route:cache || true',
    'php artisan view:cache || true',
    'php artisan migrate --force || echo "Migration failed, will retry on startup"',
    'php artisan db:seed --class=DatabaseSeeder --force || echo "Seeding skipped"'
]

[start]
# Alten Config-Cache zuerst leeren, dann mit Runtime-Env (Railway) neu cachen.
cmd = 'php artisan migrate --force || echo "Migration failed, starting server anyway" && php artisan config:clear && php artisan config:cache || true && php artisan serve --host=0.0.0.0 --port=$PORT'

